<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skriftspor</title>
  <meta name="description" content="Skriv en tekst som husker hvordan den ble til, og spill av andres spor-filer. Alt skjer i nettleseren din.">
  <meta property="og:title" content="Skriftspor">
  <meta property="og:description" content="Skriv en tekst som husker hvordan den ble til, og spill av andres spor-filer. Alt skjer i nettleseren din.">
  <meta property="og:url" content="https://skriftspor.no/">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/app.css">

  <script src="/js/skriftspor.js" defer></script>
  <script src="/js/replay.js" defer></script>
  <script src="/js/extract.js" defer></script>
  <script src="/js/docx.js" defer></script>
  <script src="/js/write.js" defer></script>
  <script src="/js/inbox.js" defer></script>
</head>
<body data-view="start">

  <!--
    THE TOOL IS THIS ONE PAGE. The bar holds the wordmark and a two-item
    menu (Vidar, 2026-10-19): /slik-bruker-du/ and /om/. Everything the
    tool does is a view on this page, switched by js/inbox.js: start,
    write, overview, detail.
    Text is kept to a minimum on purpose; what was removed is listed in the
    project note (work/Projects/Skriftspor.md), not here.
  -->
  <header class="siteheader">
    <div class="siteheader__inner">
      <a class="wordmark" href="/" id="home"><span class="wordmark__mark" aria-hidden="true">&#9679;</span>Skriftspor</a>
      <nav class="sitenav" aria-label="Hovedmeny">
        <a href="/slik-bruker-du/">Slik bruker du</a>
        <a href="/om/">Om siden</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- ===== START: drop zone + start writing ===== -->
    <section class="dropband" id="dropband">
      <div class="dropband__inner">
        <div class="dropband__zone" id="dropzone">
          <p class="dropband__title">Slipp spor-filer her</p>
          <div class="btn-row dropband__actions">
            <button type="button" class="btn btn--primary" id="pick-files">Velg filer</button>
            <button type="button" class="btn btn--ghost" id="start-new">Start ny tekst</button>
            <button type="button" class="btn btn--ghost" id="continue-local" hidden>Fortsett teksten din</button>
          </div>
        </div>
        <input type="file" id="file-input" accept=".spor,.json,application/json" multiple hidden>
      </div>
    </section>

    <p class="inbox__error" id="inbox-error" role="alert" hidden></p>

    <!-- ===== WRITE ===== -->
    <div id="write" hidden>
      <section class="band band--alt writebar">
        <div class="band__inner writebar__inner">
          <div class="writebar__title">
            <label for="write-title" class="visually-hidden">Tittel</label>
            <input id="write-title" class="writebar__titleinput" type="text" placeholder="Tittel" autocomplete="off" maxlength="120">
            <label for="write-author" class="visually-hidden">Navn</label>
            <input id="write-author" class="writebar__authorinput" type="text" placeholder="Navn" autocomplete="name" maxlength="80">
            <p id="write-status" class="writebar__status" role="status"></p>
          </div>
          <div class="btn-row writebar__actions">
            <button type="button" id="btn-download" class="btn btn--primary">Last ned spor-fil</button>
            <button type="button" id="btn-docx" class="btn btn--ghost">Last ned .docx</button>
            <button type="button" id="btn-copy" class="btn btn--ghost">Kopier</button>
            <button type="button" id="btn-play" class="btn btn--ghost">Spill av</button>
            <button type="button" id="btn-resume" class="btn btn--quiet">Åpne spor-fil</button>
            <button type="button" id="btn-new" class="btn btn--quiet">Ny tekst</button>
            <input type="file" id="resume-file" accept=".spor,.json,application/json" hidden>
          </div>
        </div>
      </section>

      <section class="band writearea">
        <div class="band__inner writearea__inner">
          <div class="formatbar" role="toolbar" aria-label="Formatering">
            <button type="button" class="formatbar__btn formatbar__btn--h" data-format="h1" title="Overskrift 1" aria-label="Overskrift 1" aria-pressed="false">H1</button>
            <button type="button" class="formatbar__btn formatbar__btn--h" data-format="h2" title="Overskrift 2" aria-label="Overskrift 2" aria-pressed="false">H2</button>
            <button type="button" class="formatbar__btn formatbar__btn--h" data-format="h3" title="Overskrift 3" aria-label="Overskrift 3" aria-pressed="false">H3</button>
            <button type="button" class="formatbar__btn" data-format="bold" title="Fet (Ctrl+B)" aria-label="Fet" aria-pressed="false"><b>B</b></button>
            <button type="button" class="formatbar__btn" data-format="italic" title="Kursiv (Ctrl+I)" aria-label="Kursiv" aria-pressed="false"><i>I</i></button>
            <button type="button" class="formatbar__btn" data-format="underline" title="Understreket (Ctrl+U)" aria-label="Understreket" aria-pressed="false"><u>U</u></button>
          </div>
          <div class="sheet">
            <nav class="toc" id="toc" aria-label="Innhold"></nav>
            <div id="write-input" class="sheet__input" role="textbox" aria-multiline="true" aria-label="Teksten din" spellcheck="true" lang="nb"></div>
          </div>
          <div class="sheet__foot">
            <p id="write-stats" class="sheet__stats"></p>
            <p class="sheet__legend"><span class="legend-pasted">innlimt</span></p>
          </div>
        </div>
      </section>
    </div>

    <!-- ===== OVERVIEW: several files ===== -->
    <section class="band" id="overview" hidden>
      <div class="band__inner">
        <div class="overview__head">
          <h1 class="overview__title" id="overview-title">Innleveringer</h1>
          <div class="btn-row">
            <button type="button" class="btn btn--ghost" id="add-files">Legg til</button>
            <button type="button" class="btn btn--quiet" id="clear-files">Tøm</button>
          </div>
        </div>
        <div class="tablewrap">
          <table class="overview" id="overview-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ===== DETAIL: one submission ===== -->
    <div id="detail" hidden>
      <section class="band detail__top">
        <div class="band__inner">
          <button type="button" class="btn btn--quiet detail__back" id="back" hidden>&larr; Oversikt</button>
          <p class="eyebrow" id="detail-file"></p>
          <h1 class="detail__title" id="detail-title"></h1>
          <div id="player"></div>
          <p class="sheet__legend player__legend"><span class="legend-pasted">innlimt</span> <span class="legend-fresh">nettopp skrevet</span> <del>nettopp slettet</del></p>
        </div>
      </section>

      <section class="band band--alt">
        <div class="band__inner">
          <dl class="facts" id="detail-facts"></dl>
          <div class="share" id="detail-share"></div>
        </div>
      </section>

      <section class="band">
        <div class="band__inner">
          <div id="compare-empty">
            <div class="btn-row">
              <button type="button" class="btn btn--ghost" id="pick-doc">Sammenlign med innlevert tekst</button>
            </div>
            <details class="drop__paste">
              <summary>Lim inn teksten</summary>
              <label for="paste-doc" class="visually-hidden">Innlevert tekst</label>
              <textarea id="paste-doc" rows="6"></textarea>
              <button type="button" class="btn btn--ghost" id="paste-compare">Sammenlign</button>
            </details>
            <input type="file" id="file-doc" accept=".docx,.odt,.pdf,.txt,.md,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
          </div>
          <div id="compare-result" hidden>
            <h2 id="cmp-head"></h2>
            <div class="share" id="cmp-share"></div>
            <p class="cmp__legend">
              <span class="legend-typed">skrevet</span>
              <span class="legend-pasted">innlimt</span>
              <span class="legend-missing">ikke i spor-fila</span>
            </p>
            <div class="cmp__text" id="cmp-text"></div>
          </div>
        </div>
      </section>

      <section class="band band--alt">
        <div class="band__inner">
          <ul class="checks" id="detail-checks"></ul>
          <div class="btn-row">
            <button type="button" class="btn btn--quiet" id="drand-confirm" hidden>Bekreft tidsstempler hos drand</button>
          </div>
          <p class="note-small" id="drand-result"></p>
        </div>
      </section>
    </div>

  </main>

  <!-- Asked when a new text is started. Both can be changed later in the bar. -->
  <dialog class="meta" id="meta">
    <form method="dialog" class="meta__form">
      <h2 class="meta__title">Ny tekst</h2>
      <label class="meta__field">Navn<input id="meta-author" type="text" autocomplete="name" maxlength="80" required></label>
      <label class="meta__field">Tittel<input id="meta-title" type="text" autocomplete="off" maxlength="120" required></label>
      <div class="btn-row">
        <button type="submit" class="btn btn--primary" value="ok">Start</button>
        <button type="submit" class="btn btn--quiet" value="cancel" formnovalidate>Avbryt</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="dragcover" id="dragcover" aria-hidden="true" hidden><p>Slipp filene</p></div>

</body>
</html>
